
[SERVICE]
    Flush           2
    Grace           5
    Daemon          Off
    Log_Level       info
    Parsers_File    /etc/fluent-bit/parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    storage.path    /var/lib/fluent-bit/

[INPUT]
    Name              tail
    Tag               cms.update
    Path              /opt/cms/logs/update_events.log
    Parser            cms_update_event
    DB                /var/lib/fluent-bit/cms_update.db
    Mem_Buf_Limit     5MB
    Refresh_Interval  3

[INPUT]
    Name              tail
    Tag               cms.error
    Path              /opt/cms/logs/error.log
    Parser            cms_error
    DB                /var/lib/fluent-bit/cms_error.db
    Mem_Buf_Limit     5MB
    Refresh_Interval  5

[INPUT]
    Name            cpu
    Tag             cms.metrics.cpu
    Interval_Sec    30

[INPUT]
    Name            mem
    Tag             cms.metrics.mem
    Interval_Sec    30

[FILTER]
    Name    lua
    Match   cms.*
    Script  /etc/fluent-bit/scripts/enrich_update.lua
    Call    cb_enrich

[FILTER]
    Name    lua
    Match   cms.update
    Script  /etc/fluent-bit/scripts/enrich_update.lua
    Call    cb_mask_ip

[FILTER]
    Name    record_modifier
    Match   cms.*
    Record  app_name    CUT-CMS-ATM
    Record  log_source  fluent-bit

# ── Send to LOGGING SERVER ────────────────────────────────────
[OUTPUT]
    Name            loki
    Match           cms.update
    Host            x.x.x.x
    Port            3100
    Labels          job=cms-atm-updates, env=production, source=cms
    Label_Keys      $machine_id,$status,$severity,$event_type
    Line_Format     json
    Retry_Limit     5

[OUTPUT]
    Name            loki
    Match           cms.error
    Host            x.x.x.x
    Port            3100
    Labels          job=cms-errors, env=production, source=cms
    Line_Format     json
    Retry_Limit     5

[OUTPUT]
    Name            loki
    Match           cms.metrics.*
    Host            x.x.x.x
    Port            3100
    Labels          job=cms-metrics, env=production, source=cms
    Line_Format     json
    Retry_Limit     5

# ── Local audit file (keep a copy on CMS) ────────────────────
[OUTPUT]
    Name    file
    Match   cms.update
    Path    /opt/cms/logs/audit/
    File    update_audit.log
    Format  plain
