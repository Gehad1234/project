[PARSER]
    Name        cms_update_event
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S

[PARSER]
    Name        cms_error
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S

[PARSER]
    Name        atm_daemon_log
    Format      regex
    Regex       ^\((?<time>[^)]+)\)\s+\[(?<level>\w+)\s*\]\s+(?<message>.+)
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S
